<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOSAME — Drop 001</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#030303;
      --panel:#0a0a0a;
      --line:#1e1e1e;
      --text:#f5f5f5;
      --muted:#b8b8b8;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,Arial,sans-serif;
      letter-spacing:.01em;
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .site-header{
      height:156px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      padding:0 5vw;
      border-bottom:1px solid var(--line);
      background:#020202;
      position:sticky;
      top:0;
      z-index:20;
      box-shadow:
        0 1px 0 rgba(255,255,255,.035),
        0 8px 24px rgba(255,255,255,.025),
        0 14px 42px rgba(255,255,255,.018);
    }
    .nav,.header-actions{display:flex;align-items:center;gap:44px}
    .nav a,.currency{
      font-size:13px;
      font-weight:600;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    .nav a{position:relative;padding:18px 0}
    .nav a.active::after{
      content:"";
      position:absolute;
      height:2px;
      background:#fff;
      left:0;right:0;bottom:0;
    }
    .brand img{
      display:block;
      width:210px;
      height:118px;
      object-fit:cover;
      object-position:center;
      mix-blend-mode:screen;
      filter:
        grayscale(1)
        contrast(1.45)
        brightness(1.35)
        drop-shadow(0 0 5px rgba(255,255,255,.20))
        drop-shadow(0 0 14px rgba(255,255,255,.08));
      transition:filter .3s ease;
    }
    .brand:hover img{
      filter:
        grayscale(1)
        contrast(1.45)
        brightness(1.4)
        drop-shadow(0 0 7px rgba(255,255,255,.28))
        drop-shadow(0 0 18px rgba(255,255,255,.12));
    }
    .header-actions{justify-self:end;gap:28px}
    .icon-btn{
      width:28px;height:28px;
      display:grid;place-items:center;
      position:relative;
      cursor:pointer;
      opacity:.95;
    }
    .cart-count{
      position:absolute;
      right:-7px;bottom:-5px;
      width:18px;height:18px;border-radius:50%;
      background:#fff;color:#000;
      font-size:10px;font-weight:700;
      display:grid;place-items:center;
    }

    .hero{
      height:clamp(470px, 43vw, 620px);
      min-height:470px;
      position:relative;
      overflow:hidden;
      border-bottom:1px solid #111;
      background:#030303 url('./hero.jpg') center/cover no-repeat;
    }

    .hero-video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center center;
      display:block;
      z-index:0;
    }

    .hero-video-overlay{
      position:absolute;
      inset:0;
      z-index:1;
      background:
        linear-gradient(90deg,
          rgba(0,0,0,.94) 0%,
          rgba(0,0,0,.86) 24%,
          rgba(0,0,0,.55) 43%,
          rgba(0,0,0,.18) 62%,
          rgba(0,0,0,.10) 100%),
        linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.18));
      pointer-events:none;
    }

    .hero-copy{
      position:relative;
      z-index:2;
      height:100%;
      width:min(640px,46vw);
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:54px 0 50px 7.6vw;
      background:none;
    }

    .eyebrow{
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.34em;
      margin-bottom:14px;
    }
    .hero h1{
      font-family:Anton, Impact, sans-serif;
      font-size:77px;
      line-height:.95;
      letter-spacing:.08em;
      font-weight:400;
      margin:0 0 18px;
    }
    .hero p{
      margin:0 0 34px;
      color:#dedede;
      font-size:16px;
      letter-spacing:.04em;
    }
    .cta{
      width:208px;
      height:53px;
      border:1px solid #d6d6d6;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 28px 0 32px;
      font-size:13px;
      font-weight:600;
      letter-spacing:.17em;
      text-transform:uppercase;
      transition:.25s ease;
    }
    .cta:hover{background:#fff;color:#000}

    .slider-dots{
      position:absolute;
      left:50%;
      bottom:26px;
      transform:translateX(-50%);
      display:flex;
      gap:10px;
      z-index:3;
    }
    .slider-dots span{width:38px;height:2px;background:#444;display:block}
    .slider-dots span:first-child{background:#fff}

    .featured{
      padding:45px 7.5vw 30px;
    }
    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
    }
    .section-head h2,.view-all{
      margin:0;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.32em;
      font-weight:500;
    }
    .view-all{font-size:12px;letter-spacing:.22em}
    .products{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:26px;
    }
    .product-card{cursor:pointer}
    .product-image{
      aspect-ratio:1.08/1;
      background:#171717;
      overflow:hidden;
      position:relative;
    }
    .product-image img{
      width:100%;height:100%;
      object-fit:cover;
      display:block;
      transition:transform .4s ease, filter .4s ease;
      filter:brightness(.98);
    }
    .product-card:hover img{transform:scale(1.025);filter:brightness(1.08)}
    .product-meta{padding:12px 7px 0}
    .product-name{
      text-transform:uppercase;
      font-size:12px;
      letter-spacing:.18em;
      font-weight:600;
      margin-bottom:8px;
    }
    .product-price{font-size:14px}

    .mobile-menu{display:none}
    .drawer{
      position:fixed;inset:0 0 0 auto;
      width:min(420px,100%);
      background:#080808;
      border-left:1px solid #222;
      padding:28px;
      transform:translateX(100%);
      transition:.3s ease;
      z-index:50;
    }
    .drawer.open{transform:translateX(0)}
    .drawer-top{display:flex;justify-content:space-between;align-items:center}
    .drawer h3{letter-spacing:.2em;text-transform:uppercase;font-size:14px}
    .drawer .empty{color:#aaa;margin-top:30px}
    .close{background:none;border:0;color:#fff;font-size:28px;cursor:pointer}

    @media (max-width:900px){
      .site-header{height:100px;padding:0 24px;grid-template-columns:auto 1fr auto}
      .nav{display:none}
      .mobile-menu{display:block;background:none;border:0;color:#fff;font-size:24px}
      .brand{justify-self:center}
      .brand img{width:150px;height:80px}
      .currency,.user-icon{display:none}
      .hero{
        height:560px;
        min-height:560px;
      }
      .hero-copy{
        width:72%;
        height:100%;
        padding:64px 28px 58px;
      }
      .hero-video{
        object-position:62% center;
      }
      .hero-video-overlay{
        background:
          linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.72) 50%,rgba(0,0,0,.24) 100%),
          linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.2));
      }
      .hero h1{font-size:58px}
      .products{grid-template-columns:repeat(2,1fr)}
      .featured{padding:38px 24px}
    }
    @media (max-width:560px){
      .hero{
        height:500px;
        min-height:500px;
      }
      .hero-copy{
        width:100%;
        padding:54px 24px 52px;
      }
      .hero-video{
        object-position:66% center;
      }
      .hero h1{font-size:48px}
      .products{grid-template-columns:1fr}
      .section-head{align-items:flex-end}
      .view-all{font-size:10px}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="active" href="#shop">Shop</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>

    <button class="mobile-menu" aria-label="Open menu">☰</button>

    <a class="brand" href="#" aria-label="KOSAME home">
      <img src="./logo.png" alt="KOSAME" />
    </a>

    <div class="header-actions">
      <div class="currency">USD⌄</div>
      <div class="icon-btn user-icon" aria-label="Account">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="7" r="4"></circle><path d="M4.5 22c.8-5 3.2-7.5 7.5-7.5S18.7 17 19.5 22"></path>
        </svg>
      </div>
      <div class="icon-btn" id="cartBtn" aria-label="Cart">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M6 8h12l1 13H5L6 8Z"></path><path d="M9 9V6a3 3 0 0 1 6 0v3"></path>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="shop">
      <video class="hero-video" autoplay muted loop playsinline poster="hero.jpg">
        <source src="./hero-video.mp4" type="video/mp4">
      </video>
      <div class="hero-video-overlay"></div>

      <div class="hero-copy">
        <div class="eyebrow">New Drop</div>
        <h1>DROP 001</h1>
        <p>Built in silence. Worn by few.</p>
        <a class="cta" href="#featured"><span>Shop now</span><span>→</span></a>
      </div>

      <div class="slider-dots"><span></span><span></span><span></span></div>
    </section>

    <section class="featured" id="featured">
      <div class="section-head">
        <h2>Featured</h2>
        <a class="view-all" href="#featured">View All</a>
      </div>

      <div class="products">
        <article class="product-card" data-name="Starfall Hoodie">
          <div class="product-image"><img src="./starfall_hoodie.jpg" alt="Redacted"></div>
          <div class="product-meta">
            <div class="product-name">Redacted</div>
            <div class="product-price">$30.00</div>
          </div>
        </article>

        <article class="product-card" data-name="Kosame Tee">
          <div class="product-image"><img src="./kosame_tee.jpg" alt="Redacted"></div>
          <div class="product-meta">
            <div class="product-name">Redacted</div>
            <div class="product-price">$45.00</div>
          </div>
        </article>

        <article class="product-card" data-name="Void Zip Hoodie">
          <div class="product-image"><img src="./void_zip_hoodie.jpg" alt="Redacted"></div>
          <div class="product-meta">
            <div class="product-name">Redacted</div>
            <div class="product-price">$90.00</div>
          </div>
        </article>

        <article class="product-card" data-name="Star Sweatpants">
          <div class="product-image"><img src="./star_sweatpants.jpg" alt="Redacted"></div>
          <div class="product-meta">
            <div class="product-name">Redacted</div>
            <div class="product-price">$70.00</div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <aside class="drawer" id="cartDrawer" aria-hidden="true">
    <div class="drawer-top">
      <h3>Cart</h3>
      <button class="close" id="closeCart" aria-label="Close cart">×</button>
    </div>
    <div class="empty" id="cartMessage">Your cart is empty.</div>
  </aside>

  <script>
    const cartDrawer = document.getElementById('cartDrawer');
    const cartBtn = document.getElementById('cartBtn');
    const closeCart = document.getElementById('closeCart');
    const cartCount = document.getElementById('cartCount');
    const cartMessage = document.getElementById('cartMessage');
    let count = 0;

    cartBtn.addEventListener('click', () => cartDrawer.classList.add('open'));
    closeCart.addEventListener('click', () => cartDrawer.classList.remove('open'));

    document.querySelectorAll('.product-card').forEach(card => {
      card.addEventListener('click', () => {
        count++;
        cartCount.textContent = count;
        cartMessage.textContent = `${count} item${count === 1 ? '' : 's'} in your cart.`;
        cartDrawer.classList.add('open');
      });
    });
  </script>
</body>
</html>
